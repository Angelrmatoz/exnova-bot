[project]
name = "exnova-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "joblib>=1.5.3",
    "pandas>=3.0.5",
    "pandas-stubs~=3.0.5",
    "python-dotenv>=1.0",
    "requests>=2.0",
    "scikit-learn>=1.9.0",
    "shap>=0.52.0",
    "ta>=0.11.0",
    "websocket-client==1.8.0",
    "xgboost>=3.4.0",
]

[tool.uv]

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
